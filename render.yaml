services:
  - type: web
    name: opspilot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: LLM_PROVIDER
        value: deterministic
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
